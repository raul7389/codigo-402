<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera App en Stellar - Pura Vida Bootcamp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Stellar Raven Payment & DApp</h1>
        <p class="subtitle">Desarrollado con el apoyo de Stellar Raven MCP</p>
        
        <div class="card">
            <h2>Conexión de Wallet</h2>
            <p>Conecta tu wallet Freighter para interactuar con la red de pruebas.</p>
            <button id="connectWalletBtn" class="btn">Conectar Wallet</button>
            <div id="walletStatus" class="status">Estado: Desconectado</div>
            <div id="walletAddress" class="address"></div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
